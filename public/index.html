<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nota · AI 语音便签</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Nota <small>AI 语音便签 · MVP</small></div>
    <div class="who">
      <select id="user"></select>
      <span id="quota" class="pill">—</span>
      <span id="model" class="muted"></span>
    </div>
  </header>

  <main class="layout">
    <section class="col">
      <div class="card composer">
        <textarea id="text" rows="4" placeholder="按住麦克风说话，或直接输入一段话…"></textarea>
        <div class="row">
          <button id="mic" class="ghost" title="浏览器语音识别（Chrome）">🎙 按住说话</button>
          <div class="spacer"></div>
          <button id="replay" class="ghost" disabled title="用上一个 requestId 重发，模拟网络重试">↻ 重发上一请求</button>
          <button id="send" class="primary">发送</button>
        </div>
        <div class="examples">
          <span>试试：</span>
          <button class="chip">下周三下午约张总吃饭，提前一天提醒我</button>
          <button class="chip">今天跟张总聊了报价，他说每台 120 元，500 台起订，我周五前要给他答复</button>
          <button class="chip">上个月跟张总聊的那个报价是多少？</button>
        </div>
      </div>

      <div class="card">
        <h3>Agent 调用过程 <small id="reqinfo" class="muted"></small></h3>
        <ol id="steps" class="steps"><li class="muted">发送后在这里实时显示 Agent 每一步调用了什么工具</li></ol>
        <div id="reply" class="reply hidden"></div>
      </div>
    </section>

    <section class="col">
      <div class="card">
        <nav class="tabs">
          <button data-tab="todos" class="active">待办</button>
          <button data-tab="events">日程</button>
          <button data-tab="reminders">提醒</button>
          <button data-tab="notes">历史便签</button>
        </nav>
        <div id="panel"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
